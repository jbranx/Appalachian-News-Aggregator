name: Daily News Aggregator
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_mode) && 'Test run' || 'Daily edition' }}
on:
  schedule:
    - cron: '17 11 * * *'
    # Backup trigger in case GitHub delays or drops the first one.
    # The duplicate check below makes sure only one edition goes out per day.
    - cron: '47 14 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send only to me (test run)'
        type: boolean
        default: true
jobs:
  run-news-aggregator:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
    - name: Skip if today's edition already went out
      id: guard
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PY'
        import json, os, subprocess
        from datetime import datetime, timedelta, timezone
        phx = timezone(timedelta(hours=-7))  # Arizona, no daylight saving
        today = datetime.now(phx).date()
        out = subprocess.run(["gh", "api",
            f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/main.yml/runs?per_page=30"],
            capture_output=True, text=True, check=True).stdout
        me = int(os.environ["GITHUB_RUN_ID"])
        done = False
        for r in json.loads(out)["workflow_runs"]:
            if r["id"] == me or r["display_title"] == "Test run":
                continue
            started = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).astimezone(phx).date()
            if started != today:
                continue
            if r["conclusion"] == "success" or r["status"] in ("in_progress", "queued"):
                print(f"Today's edition already handled by run {r['id']} - skipping.")
                done = True
                break
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"skip={'true' if done else 'false'}\n")
        PY
    - name: Check out repository
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@v5
    - name: Set up Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run news aggregator
      if: steps.guard.outputs.skip != 'true'
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: python news_aggregator.py

  keepalive:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
    - name: Keep the daily schedule from being switched off
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow enable main.yml --repo ${{ github.repository }}
